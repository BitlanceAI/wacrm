trigger:
  - main

variables:
  - name: dockerRegistryServiceConnection
    value: 'wacrm-acr-connection'
  - name: containerRegistry
    value: 'bitlanceaiapp.azurecr.io'
  - name: tag
    value: '$(Build.BuildId)'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and Push Stage
    jobs:
      - job: BuildAndPush
        displayName: Build and Push Images
        pool:
          vmImage: $(vmImageName)
        steps:
          # 1. Build & Push Frontend (as a Docker container)
          - task: Docker@2
            displayName: "Build & Push Frontend"
            inputs:
              command: buildAndPush
              repository: 'wacrm'
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest
              arguments: '--build-arg NEXT_PUBLIC_SUPABASE_URL=$(NEXT_PUBLIC_SUPABASE_URL) --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=$(NEXT_PUBLIC_SUPABASE_ANON_KEY) --build-arg NEXT_PUBLIC_API_BASE_URL=$(NEXT_PUBLIC_API_BASE_URL) --build-arg NEXT_PUBLIC_GOOGLE_AI_API_KEY=$(NEXT_PUBLIC_GOOGLE_AI_API_KEY)'
